# Full stack: Postgres + API + web.
#   docker compose up --build     ->  http://localhost:8080
#
# Copy .env.example to .env first if you want to change the defaults or add an
# ANTHROPIC_API_KEY.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-virtual_office}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-virtual_office}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  api:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-virtual_office}
      SECRET_KEY: ${SECRET_KEY:-dev-secret-change-me-in-production-please-use-32-bytes}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DEBUG: ${DEBUG:-false}
      # Same-origin through the nginx proxy, so CORS is not needed in this setup.
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.1-flash-lite}
      SEED_ON_STARTUP: ${SEED_ON_STARTUP:-true}
      STORAGE_DIR: /app/storage
    volumes:
      - storage:/app/storage
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      args:
        # Relative path: the browser calls the nginx proxy on its own origin.
        VITE_API_URL: /api
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
  storage:
