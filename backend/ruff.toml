line-length = 110
target-version = "py311"

[lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = [
    "E501",   # line length is handled by the formatter, not enforced here
    "B008",   # FastAPI's Depends()/File() in defaults is the framework idiom
    "UP042",  # `str, Enum` is deliberate: SQLAlchemy persists the member while
              # FastAPI serialises the value. StrEnum would change both.
]

[lint.per-file-ignores]
"tests/*" = ["S101"]
"alembic/*" = ["E", "F", "I", "UP"]
